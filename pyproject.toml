[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecode"
dynamic = ["version"]
description = "Local-first speech-to-text desktop app for coding and writing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VoiceCode contributors" }]
keywords = ["speech-to-text", "whisper", "desktop", "dictation", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "flask>=3.1,<4",
  "numpy>=1.26,<3",
  "requests>=2.31,<3",
  "pywebview>=5.0.5,<6",
  "pynput>=1.7.6,<2",
  "waitress>=3.0,<4",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
runtime = [
  "faster-whisper>=1.1.1,<2",
  "sounddevice>=0.5,<1",
]
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.15.0",
  "mypy>=1.10.0",
  "pre-commit>=4.0.0",
  "types-psutil",
]
e2e = [
  "pytest>=9.0.0",
  "playwright>=1.52,<2",
]
tray = [
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
]
gpu = [
  "nvidia-ml-py>=12.560.30",
]
audio = [
  "soundfile>=0.12,<1",
]
zh = [
  "opencc-python-reimplemented>=0.1.7,<1",
]
quality = [
  "jiwer>=3,<5",
]
diarization = [
  "pyannote.audio>=3,<5",
]
punctuation = [
  "nemo-toolkit[nlp]>=1,<3",
]
extensions = [
  "soundfile>=0.12,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "jiwer>=3,<5",
]

[project.scripts]
voicecode = "voicecode.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "voicecode.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicecode = ["static/index.html", "static/css/*.css", "static/js/*.js", "static/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
[[tool.mypy.overrides]]
module = ["psutil", "pynvml"]
ignore_missing_imports = true
