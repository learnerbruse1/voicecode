name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check app.py main.py tests src/voicecode
      - name: Ruff format check
        run: python -m ruff format --check app.py main.py tests src/voicecode
      - name: Mypy
        run: python -m mypy app.py main.py src/voicecode
      - name: Static mirror check
        run: python -X utf8 tools/sync_static.py --check
      - name: JavaScript syntax
        shell: pwsh
        run: Get-ChildItem src/voicecode/static/js/*.js | ForEach-Object { node --check $_.FullName }
      - name: Pytest
        run: python -m pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Verify wheel package data
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          python -c "import importlib.resources as r; root=r.files('voicecode').joinpath('static'); assert root.joinpath('i18n','en.json').is_file(); assert root.joinpath('js','onboarding.js').is_file()"


  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[e2e]"
          python -m playwright install --with-deps chromium
      - name: Run browser smoke test
        env:
          VOICECODE_RUN_E2E: "1"
        run: python -m pytest tests/e2e/test_ui_smoke.py
