name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and quality tools
        run: |
          python -m pip install --upgrade pip build twine cyclonedx-bom
          python -m pip install -e ".[dev]"
      - name: Quality gates
        run: |
          python -m ruff format --check app.py main.py tests src/voicecode
          python -m ruff check app.py main.py tests src/voicecode
          python -m mypy app.py main.py src/voicecode
          python -X utf8 -m pytest -q
          python -X utf8 -m pytest tests/test_app_smoke.py --cov=voicecode --cov-report=term-missing --cov-fail-under=75
          python -X utf8 tools/sync_static.py --check
          for file in src/voicecode/static/js/*.js; do node --check "$file"; done
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Clean-environment wheel smoke test
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -c "import importlib.resources as r, voicecode; root=r.files('voicecode').joinpath('static'); assert root.joinpath('i18n','en.json').is_file(); assert root.joinpath('js','onboarding.js').is_file(); print(voicecode.__version__)"
      - name: Generate checksums and SBOM
        run: |
          sha256sum dist/* > dist/SHA256SUMS.txt
          cyclonedx-py environment --output-format JSON --output-file dist/voicecode-sbom.json
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voicecode-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/voicecode-sbom.json
